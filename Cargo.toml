[package]
name = "clnx"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Linux host drivers for the VM/GPU system: libvirt, VFIO, sysfs, systemd and Kubernetes"
repository = "https://git.corbet.ch/corbet-infra/clnx"

[dependencies]
cdrv = { git = "https://git.corbet.ch/corbet-infra/cdrv.git", branch = "main" }
# `kube` pulls `k8s-openapi`, which needs exactly one API-version feature and
# cannot build without one. The driver runs beside one cluster, so the
# minimum API server it targets is named here rather than left to a consumer.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
k8s-openapi = { version = "0.29", features = ["v1_34"] }
kube = { version = "5.1", default-features = false, features = ["client", "ring", "rustls-tls"] }
rustix = { version = "1.1.6", features = ["process", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "process", "io-util", "macros"] }
virt = "0.5"
zbus = { version = "6", default-features = false, features = ["default-rt"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
